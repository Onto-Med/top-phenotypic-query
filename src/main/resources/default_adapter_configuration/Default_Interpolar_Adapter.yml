# This adapter can be used for querying INTERPOLAR databases that are the result of the ETL process defined and
# implemented in https://github.com/medizininformatik-initiative/INTERPOLAR.
# The ETL process stores the data in a PostgreSQL database "cds_hub_db" under various schemas
# (see https://github.com/medizininformatik-initiative/INTERPOLAR/blob/main/Dataflow.md).
#
# In the context of INTERPOLAR, the TOP Framework is considered as a so called "data processor".
# Access to the database is restricted to the schemas "db2dataprocessor_out" (read) and "db2dataprocessor_in" (write).
#
# Per default, data processors should use the PostgreSQL user "db2dataprocessor_user"
# (see https://github.com/medizininformatik-initiative/INTERPOLAR/blob/main/Postgres-cds_hub/DB_description.md#rechtekonzept).
#
# The adapter has been tested using the synthetic sample data set imported from
# https://github.com/medizininformatik-initiative/kerndatensatz-testdaten.
#
# As the test data is missing encounter class codes, it is recommended to execute the following SQL update statements
# after the import:
#
# UPDATE db2dataprocessor_out.v_encounter_last_version
# SET
#	  enc_class_system = 'http://terminology.hl7.org/CodeSystem/v3-ActCode',
#	  enc_class_display = 'inpatient encounter',
#     enc_class_code = 'IMP'
# WHERE enc_id < 'UKB-0009-E-1';
#
# UPDATE db2dataprocessor_out.v_encounter_last_version
# SET
#     enc_class_system = 'http://terminology.hl7.org/CodeSystem/v3-ActCode',
#     enc_class_display = 'ambulatory',
#     enc_class_code = 'AMB'
# WHERE enc_id >= 'UKB-0009-E-1';
baseId: encounter
subjectQuery:
  baseQuery: "SELECT enc_id, pat_birthdate, pat_gender FROM db2dataprocessor_out.v_patient_last_version, db2dataprocessor_out.v_encounter_last_version\nWHERE enc_patient_ref = 'Patient/' || pat_id AND enc_age_at_admission >= 18"
  sexListPart: "\nAND pat_gender IN ({values})"
  birthdateIntervalPart: "\nAND pat_birthdate {operator} {value}"
  output:
    id: enc_id
    sex: pat_gender
    birthdate: pat_birthdate
phenotypeQueries:
  encounter:
    baseQuery: "SELECT enc_id, enc_period_start, enc_period_end, enc_class_code FROM db2dataprocessor_out.v_encounter_last_version\nWHERE enc_type_code = 'einrichtungskontakt' AND enc_age_at_admission >= 18"
    textValueListPart: "\nAND enc_class_code IN ({values})"
    startDateTimeIntervalPart: "\nAND enc_period_start {operator} {value}"
    endDateTimeIntervalPart: "\nAND (enc_period_end IS NULL OR enc_period_end {operator} {value})"
    output:
      subject: enc_id
      textValue: enc_class_code
      startDateTime: enc_period_start
      endDateTime: enc_period_end
  # Numeric observations use the ETL's primary LOINC code and reference-unit value.
  # Only successful unit conversions or values already in that unit are eligible.
  # Repeated rows of an identified resource are collapsed on the relevant measurement fields.
  # Rows without a resource ID are retained individually to avoid merging unrelated measurements.
  observation:
    baseQuery: |
      WITH valid_obs AS (
        SELECT
          obs_id,
          obs_encounter_calculated_ref,
          obs_effectivedatetime,
          analysis_value,
          analysis_loinc_code,
          analysis_unit,
          obs_referencerange_low_value,
          obs_referencerange_low_code,
          obs_referencerange_high_value,
          obs_referencerange_high_code,
          NULLIF(obs_referencerange_type_code, '') AS clean_ref_type_code
        FROM db2dataprocessor_out.v_observation_last_version
        WHERE analysis_value_status IN ('converted', 'already_reference_unit')
          AND analysis_value IS NOT NULL
      ),
      distinct_obs AS (
        SELECT DISTINCT
          obs_id, obs_encounter_calculated_ref, obs_effectivedatetime,
          analysis_value, analysis_loinc_code, analysis_unit
        FROM valid_obs
        WHERE NULLIF(obs_id, '') IS NOT NULL
      ),
      ranked_ref AS (
        SELECT
          obs_id,
          analysis_loinc_code,
          obs_referencerange_low_value AS ref_low_val,
          obs_referencerange_low_code AS ref_low_code,
          obs_referencerange_high_value AS ref_high_val,
          obs_referencerange_high_code AS ref_high_code,
          clean_ref_type_code AS ref_type_code,
          ROW_NUMBER() OVER (
            PARTITION BY obs_id, analysis_loinc_code
            ORDER BY
              CASE WHEN clean_ref_type_code = 'normal' THEN 1 ELSE 2 END ASC,
              obs_referencerange_low_value ASC
          ) AS rn
        FROM valid_obs
        WHERE NULLIF(obs_id, '') IS NOT NULL
          AND (clean_ref_type_code = 'normal' OR clean_ref_type_code IS NULL)
      ),
      best_ref AS (
        SELECT
          obs_id, analysis_loinc_code,
          ref_low_val, ref_low_code, ref_high_val, ref_high_code, ref_type_code
        FROM ranked_ref
        WHERE rn = 1
      )
      SELECT un.enc_id, un.da, un.va, un.co, un.analysis_unit,
             un.ref_low_val, un.ref_low_code,
             un.ref_high_val, un.ref_high_code,
             un.ref_type_code
      FROM (
        -- 1. Observations MIT obs_id
        SELECT
          SUBSTRING(o.obs_encounter_calculated_ref FROM 11) AS enc_id,
          o.obs_effectivedatetime AS da,
          o.analysis_value AS va,
          o.analysis_loinc_code AS co,
          o.analysis_unit,
          r.ref_low_val, r.ref_low_code,
          r.ref_high_val, r.ref_high_code,
          r.ref_type_code
        FROM distinct_obs o
        LEFT JOIN best_ref r
          ON o.obs_id = r.obs_id AND o.analysis_loinc_code = r.analysis_loinc_code
        JOIN db2dataprocessor_out.v_encounter_last_version enc
          ON SUBSTRING(o.obs_encounter_calculated_ref FROM 11) = enc.enc_id
        WHERE enc.enc_age_at_admission >= 18

        UNION ALL

        -- 2. Observations OHNE obs_id
        SELECT
          SUBSTRING(v.obs_encounter_calculated_ref FROM 11) AS enc_id,
          v.obs_effectivedatetime AS da,
          v.analysis_value AS va,
          v.analysis_loinc_code AS co,
          v.analysis_unit,
          CASE WHEN v.clean_ref_type_code = 'normal' OR v.clean_ref_type_code IS NULL THEN v.obs_referencerange_low_value END AS ref_low_val,
          CASE WHEN v.clean_ref_type_code = 'normal' OR v.clean_ref_type_code IS NULL THEN v.obs_referencerange_low_code END AS ref_low_code,
          CASE WHEN v.clean_ref_type_code = 'normal' OR v.clean_ref_type_code IS NULL THEN v.obs_referencerange_high_value END AS ref_high_val,
          CASE WHEN v.clean_ref_type_code = 'normal' OR v.clean_ref_type_code IS NULL THEN v.obs_referencerange_high_code END AS ref_high_code,
          CASE WHEN v.clean_ref_type_code = 'normal' OR v.clean_ref_type_code IS NULL THEN v.clean_ref_type_code END AS ref_type_code
        FROM valid_obs v
        JOIN db2dataprocessor_out.v_encounter_last_version enc
          ON SUBSTRING(v.obs_encounter_calculated_ref FROM 11) = enc.enc_id
        WHERE NULLIF(v.obs_id, '') IS NULL
          AND enc.enc_age_at_admission >= 18

        UNION ALL

        -- 3. Aufnahmealter
        SELECT
          enc_id,
          enc_period_start AS da,
          CAST(enc_age_at_admission AS float8) AS va,
          '29553-5' AS co,
          CAST('a' AS varchar) AS analysis_unit,
          CAST(NULL AS float8) AS ref_low_val,
          CAST(NULL AS varchar) AS ref_low_code,
          CAST(NULL AS float8) AS ref_high_val,
          CAST(NULL AS varchar) AS ref_high_code,
          CAST(NULL AS varchar) AS ref_type_code
        FROM db2dataprocessor_out.v_encounter_last_version
        WHERE enc_age_at_admission IS NOT NULL AND enc_age_at_admission >= 18
      ) AS un
      WHERE 'http://loinc.org|' || un.co IN ({codes})
    numberValueIntervalPart: "\nAND va {operator} {value}"
    numberValueListPart: "\nAND va IN ({values})"
    dateTimeIntervalPart: "\nAND da {operator} {value}"
    output:
      subject: enc_id
      numberValue: va
      dateTime: da
      fields:
        unit: analysis_unit
        refLowVal: ref_low_val
        refLowUnit: ref_low_code
        refHighVal: ref_high_val
        refHighUnit: ref_high_code
  # ICD-10-GM model codes match themselves and their descendants, ignoring suffixes.
  # A model containing only child codes does not implicitly match their parent.
  # Other code systems retain exact system-and-code matching.
  condition:
    baseQuery: |
      WITH model_codes AS (
        SELECT DISTINCT
          CASE
            WHEN LEFT(code, LENGTH('http://fhir.de/CodeSystem/bfarm/icd-10-gm|')) = 'http://fhir.de/CodeSystem/bfarm/icd-10-gm|'
            THEN REGEXP_SUBSTR(
              SUBSTRING(code FROM LENGTH('http://fhir.de/CodeSystem/bfarm/icd-10-gm|') + 1),
              '^[A-Z][0-9]{2}(\.[0-9]{1,2})?')
            ELSE code
          END AS code
        -- The typed NULL lets H2 infer the array type before JDBC parameters are bound.
        FROM UNNEST(ARRAY[CAST(NULL AS VARCHAR), {codes}]) AS model(code)
        WHERE code IS NOT NULL
      )
      SELECT
        SUBSTRING(con.con_encounter_calculated_ref FROM 11) AS enc_id,
        con.con_onsetperiod_start AS start_date_time,
        con.con_onsetperiod_end AS end_date_time,
        CASE
          WHEN con.con_onsetperiod_start IS NULL AND con.con_onsetperiod_end IS NULL AND con.con_onsetdatetime IS NULL
          THEN con.con_recordeddate
          ELSE con.con_onsetdatetime
        END
        AS date_time 
      FROM
        db2dataprocessor_out.v_condition_last_version con
      JOIN
        db2dataprocessor_out.v_encounter_last_version enc
        ON SUBSTRING(con.con_encounter_calculated_ref FROM 11) = enc.enc_id
      WHERE
        enc.enc_age_at_admission >= 18 AND
        -- ICD prefixes have length 3, 5 or 6. Uncorrelated IN subqueries allow
        -- hashed lookups instead of testing every model prefix for every row.
        -- Normalize only model codes; suffixes on data codes are ignored.
        (CASE WHEN con_code_system = 'http://fhir.de/CodeSystem/bfarm/icd-10-gm' THEN
          LEFT(con_code_code, 3) IN (SELECT code FROM model_codes)
          OR LEFT(con_code_code, 5) IN (SELECT code FROM model_codes)
          OR LEFT(con_code_code, 6) IN (SELECT code FROM model_codes)
        ELSE
          con_code_system || '|' || con_code_code IN (SELECT code FROM model_codes)
        END)
    startDateTimeIntervalPart: |
      AND
      CASE
        WHEN con.con_onsetperiod_start IS NOT NULL OR (con.con_onsetperiod_start IS NULL AND con.con_onsetperiod_end IS NULL)
          THEN COALESCE(con.con_onsetperiod_start, con.con_onsetdatetime, con.con_recordeddate) {operator} {value}
        ELSE true
      END
    endDateTimeIntervalPart: |
      AND
      CASE
        WHEN con.con_onsetperiod_end IS NOT NULL OR (con.con_onsetperiod_start IS NULL AND con.con_onsetperiod_end IS NULL)
          THEN COALESCE(con.con_onsetperiod_end, con.con_onsetdatetime, con.con_recordeddate) {operator} {value}
        ELSE true
      END
    output:
      subject: enc_id
      startDateTime: start_date_time
      endDateTime: end_date_time
      dateTime: date_time
  procedure:
    baseQuery: |
      SELECT 
          SUBSTRING(proc.proc_encounter_calculated_ref FROM 11) AS enc_id,
          proc.proc_performedperiod_start AS start_date_time,
          proc.proc_performedperiod_end AS end_date_time,
          proc.proc_performeddatetime AS date_time
      FROM 
          db2dataprocessor_out.v_procedure_last_version proc
      JOIN
          db2dataprocessor_out.v_encounter_last_version enc
          ON SUBSTRING(proc.proc_encounter_calculated_ref FROM 11) = enc.enc_id
      WHERE
          enc.enc_age_at_admission >= 18 AND 
      	  proc_code_system || '|' || proc_code_code IN ({codes})
    startDateTimeIntervalPart: |
        AND 
          CASE
            WHEN proc.proc_performedperiod_start IS NOT NULL OR (proc.proc_performedperiod_start IS NULL AND proc.proc_performedperiod_end IS NULL)
              THEN COALESCE(proc.proc_performedperiod_start, proc.proc_performeddatetime) {operator} {value}
            ELSE true
          END
    endDateTimeIntervalPart: |
        AND
          CASE
            WHEN proc.proc_performedperiod_end IS NOT NULL OR (proc.proc_performedperiod_start IS NULL AND proc.proc_performedperiod_end IS NULL)
              THEN COALESCE(proc.proc_performedperiod_end, proc.proc_performeddatetime) {operator} {value}
            ELSE true
          END
    output:
      subject: enc_id
      startDateTime: start_date_time
      endDateTime: end_date_time
      dateTime: date_time
  medication:
    union: [ medication_administration, medication_statement, medication_request ]
  medication_administration:
    baseQuery: |
      SELECT
          SUBSTRING(medadm.medadm_encounter_calculated_ref FROM 11) AS enc_id,
          medadm.medadm_effectiveperiod_start AS start_date_time,
          medadm.medadm_effectiveperiod_end AS end_date_time,
          medadm.medadm_effectivedatetime AS date_time
      FROM
          db2dataprocessor_out.v_medicationadministration_last_version medadm
      JOIN
          db2dataprocessor_out.v_encounter_last_version enc
          ON SUBSTRING(medadm.medadm_encounter_calculated_ref FROM 11) = enc.enc_id
      WHERE
          enc.enc_age_at_admission >= 18 AND
          medadm_medication_system || '|' || medadm_medication_code IN ({codes})
    startDateTimeIntervalPart: |
          AND
            CASE
              WHEN medadm.medadm_effectiveperiod_start IS NOT NULL OR (medadm.medadm_effectiveperiod_start IS NULL AND medadm.medadm_effectiveperiod_end IS NULL)
                THEN COALESCE(medadm.medadm_effectiveperiod_start, medadm.medadm_effectivedatetime) {operator} {value}
              ELSE true
            END
    endDateTimeIntervalPart: |
          AND
            CASE
              WHEN medadm.medadm_effectiveperiod_end IS NOT NULL OR (medadm.medadm_effectiveperiod_start IS NULL AND medadm.medadm_effectiveperiod_end IS NULL)
                THEN COALESCE(medadm.medadm_effectiveperiod_end, medadm.medadm_effectivedatetime) {operator} {value}
              ELSE true
            END
    output:
      subject: enc_id
      startDateTime: start_date_time
      endDateTime: end_date_time
      dateTime: date_time
  medication_statement:
    baseQuery: |
      SELECT
          SUBSTRING(medstat.medstat_encounter_calculated_ref FROM 11) AS enc_id,
          medstat.medstat_effectiveperiod_start AS start_date_time,
          medstat.medstat_effectiveperiod_end AS end_date_time,
          medstat.medstat_effectivedatetime AS date_time
      FROM
          db2dataprocessor_out.v_medicationstatement_last_version medstat
      JOIN
          db2dataprocessor_out.v_encounter_last_version enc
          ON SUBSTRING(medstat.medstat_encounter_calculated_ref FROM 11) = enc.enc_id
      WHERE
          enc.enc_age_at_admission >= 18 AND
          medstat_medication_system || '|' || medstat_medication_code IN ({codes})
    startDateTimeIntervalPart: |
      AND
        CASE
          WHEN medstat.medstat_effectiveperiod_start IS NOT NULL OR (medstat.medstat_effectiveperiod_start IS NULL AND medstat.medstat_effectiveperiod_end IS NULL)
            THEN COALESCE(medstat.medstat_effectiveperiod_start, medstat.medstat_effectivedatetime) {operator} {value}
          ELSE true
        END
    endDateTimeIntervalPart: |
      AND
        CASE
          WHEN medstat.medstat_effectiveperiod_end IS NOT NULL OR (medstat.medstat_effectiveperiod_start IS NULL AND medstat.medstat_effectiveperiod_end IS NULL)
            THEN COALESCE(medstat.medstat_effectiveperiod_end, medstat.medstat_effectivedatetime) {operator} {value}
          ELSE true
        END
    output:
      subject: enc_id
      startDateTime: start_date_time
      endDateTime: end_date_time
      dateTime: date_time
  medication_request:
    baseQuery: |
      SELECT SUBSTRING(medreq_encounter_calculated_ref FROM 11) AS enc_id, medreq_authoredon AS datetime
      FROM db2dataprocessor_out.v_medicationrequest_last_version
      JOIN
          db2dataprocessor_out.v_encounter_last_version enc
          ON SUBSTRING(medreq_encounter_calculated_ref FROM 11) = enc.enc_id
      WHERE
          enc.enc_age_at_admission >= 18 AND 
          medreq_medication_system || '|' || medreq_medication_code IN ({codes})
    dateTimeIntervalPart: "\nAND medreq_authoredon {operator} {value}"
    output:
      subject: enc_id
      dateTime: datetime
birthdateMapping:
  code: http://loinc.org|21112-8
ageMapping:
  code: http://loinc.org|30525-0
sexMapping:
  code: http://loinc.org|46098-0
